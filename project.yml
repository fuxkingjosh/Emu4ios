name: Emu4ios
options:
  bundleIdPrefix: com.fuxkingjosh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
targets:
  Emu4ios:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Bridge
      - path: App/Resources
      - path: App/CoreAssets
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - framework: Vendor/mGBA.xcframework
        embed: false
      - framework: Vendor/Cores/PCSXReARMed.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/Mesen.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/BSNES.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/ClownMDEmu.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/Gearsystem.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/Mupen64Plus.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/MednafenPCE.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/Geargrafx.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/MednafenNGP.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/MednafenWSwan.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/MednafenVB.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/MednafenLynx.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/Stella.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/A5200.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/ProSystem.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/VirtualJaguar.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/PokeMini.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/VICE.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/PUAE.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/DOSBoxPure.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/PrBoom.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/MelonDSDS.xcframework
        embed: true
        link: false
        codeSign: true
      - framework: Vendor/Cores/PPSSPP.xcframework
        embed: true
        link: false
        codeSign: true
      - sdk: libz.tbd
      - sdk: OpenGLES.framework
      - sdk: libc++.tbd
      - target: Emu4iosWidget
    entitlements:
      path: App/Emu4ios.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fuxkingjosh.emu4ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fuxkingjosh.emu4ios
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridge/Emu4ios-Bridging-Header.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Vendor/mgba-include $(SRCROOT)/App/Bridge $(SRCROOT)/App/Bridge/rcheevos/include"
        GCC_PREPROCESSOR_DEFINITIONS: "$(inherited) RC_CLIENT_SUPPORTS_HASH=1"
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_C_LANGUAGE_STANDARD: gnu11
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Neon AppIcon-Retro AppIcon-Candy AppIcon-Midnight AppIcon-Gold AppIcon-Ocean AppIcon-Lava AppIcon-Mint AppIcon-BigFour"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Emu4ios
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSSupportsLiveActivities: true
        LSApplicationCategoryType: public.app-category.games
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIFileSharingEnabled: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: TV
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).ExternalDisplaySceneDelegate
        NSLocalNetworkUsageDescription: Emu4ios finds friends nearby so their iPhones can be extra controllers.
        NSBonjourServices: [_emu4ios-pad._tcp, _emu4ios-pad._udp]
        LSSupportsOpeningDocumentsInPlace: false
        NSPhotoLibraryAddUsageDescription: Emu4ios saves your gameplay clips and screenshots to Photos.
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
        CFBundleURLTypes:
          - CFBundleURLName: com.fuxkingjosh.emu4ios
            CFBundleURLSchemes: [emu4ios]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Game Boy Game
            LSHandlerRank: Owner
            LSItemContentTypes: [com.fuxkingjosh.emu4ios.gb]
          - CFBundleTypeName: Game Boy Color Game
            LSHandlerRank: Owner
            LSItemContentTypes: [com.fuxkingjosh.emu4ios.gbc]
          - CFBundleTypeName: Game Boy Advance Game
            LSHandlerRank: Owner
            LSItemContentTypes: [com.fuxkingjosh.emu4ios.gba]
          - CFBundleTypeName: Retro Game
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.fuxkingjosh.emu4ios.rom]
          - CFBundleTypeName: Delta Skin
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.rileytestut.delta.skin]
          - CFBundleTypeName: Emu4ios Theme
            LSHandlerRank: Owner
            LSItemContentTypes: [com.fuxkingjosh.emu4ios.theme]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.fuxkingjosh.emu4ios.theme
            UTTypeDescription: Emu4ios Theme
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [e4theme]
              public.mime-type: application/x-emu4ios-theme
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.rileytestut.delta.skin
            UTTypeDescription: Delta Skin
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [deltaskin]
          - UTTypeIdentifier: com.fuxkingjosh.emu4ios.rom
            UTTypeDescription: Retro Game
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nes, fds, sfc, smc, n64, z64, v64, nds, md, gen, smd, sms, gg, sg, pce, sgx, ngp, ngc, ws, wsc, vb, lnx, a26, a52, a78, j64, min, cue, chd, cso, pbp, m3u, d64, t64, prg, crt, adf, hdf, wad, dosz]
          - UTTypeIdentifier: com.fuxkingjosh.emu4ios.gb
            UTTypeDescription: Game Boy ROM
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gb]
          - UTTypeIdentifier: com.fuxkingjosh.emu4ios.gbc
            UTTypeDescription: Game Boy Color ROM
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gbc]
          - UTTypeIdentifier: com.fuxkingjosh.emu4ios.gba
            UTTypeDescription: Game Boy Advance ROM
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [gba]
  Emu4iosWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: App/Sources/Shared/WidgetShared.swift
      - path: App/Sources/Shared/PlayActivity.swift
    entitlements:
      path: Widget/Emu4iosWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.fuxkingjosh.emu4ios
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fuxkingjosh.emu4ios.widget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Emu4ios
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
