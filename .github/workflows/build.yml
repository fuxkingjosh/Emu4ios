name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload a build to TestFlight (needs the App Store Connect secrets)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: List cores
    runs-on: ubuntu-latest
    outputs:
      cores: ${{ steps.list.outputs.cores }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: echo "cores=$(python3 -c 'import json;print(json.dumps([c["id"] for c in json.load(open("cores/cores.json"))["cores"]]))')" >> "$GITHUB_OUTPUT"

  cores:
    name: Core ${{ matrix.core }}
    needs: matrix
    runs-on: macos-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        core: ${{ fromJSON(needs.matrix.outputs.cores) }}
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache key (this core's settings + the build script)
        id: key
        run: |
          entry=$(python3 -c 'import json,sys;print(json.dumps(next(c for c in json.load(open("cores/cores.json"))["cores"] if c["id"]==sys.argv[1]),sort_keys=True))' "${{ matrix.core }}")
          echo "hash=$( (echo "$entry"; cat scripts/build-core.sh) | shasum -a 256 | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Cache core
        id: cache
        uses: actions/cache@v4
        with:
          path: Vendor/Cores
          key: core-${{ matrix.core }}-${{ steps.key.outputs.hash }}
      - name: Build core for iPhone
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/build-core.sh ${{ matrix.core }}
      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.core }}
          path: Vendor/Cores
          include-hidden-files: true
          retention-days: 3

  build:
    name: Build app (cloud Mac)
    needs: cores
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache mGBA build
        uses: actions/cache@v4
        with:
          path: |
            Vendor/mGBA.xcframework
            Vendor/mgba-include
            Vendor/.mgba-commit
          key: mgba-${{ hashFiles('scripts/build-mgba.sh', 'scripts/gen-mgba-defines.sh') }}

      - name: Build mGBA for iOS
        run: ./scripts/build-mgba.sh

      - name: Collect cores
        uses: actions/download-artifact@v4
        with:
          pattern: core-*
          path: Vendor/Cores
          merge-multiple: true

      - name: Use only the cores that built
        run: python3 scripts/prune-missing-cores.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Emu4ios.xcodeproj \
            -scheme Emu4ios \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*Emu4ios|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show app warnings
        if: always()
        run: |
          echo "Compiled: $(grep -c '^SwiftCompile' build.log || true) Swift steps, $(grep -c '^CompileC' build.log || true) C files, $(grep -c '^CompileMetalFile' build.log || true) Metal files"
          grep -E "(/App/|/Widget/).*(warning|error):" build.log | sed 's|.*/emu4ios/||' | sort -u | head -150 || true

      - name: Screenshots in the iPhone Simulator
        continue-on-error: true
        run: |
          set -x
          python3 Tests/make_test_rom.py "E4 Demo.gba"
          xcodebuild build -project Emu4ios.xcodeproj -scheme Emu4ios -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO -quiet
          APP=$(find dd/Build/Products -name "Emu4ios.app" -maxdepth 3 | head -1)
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in sorted(d.items(),reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name']))")
          xcrun simctl boot "$DEVICE"; xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$DEVICE" "$APP"
          BID=com.fuxkingjosh.emu4ios
          DATA=$(xcrun simctl get_app_container "$DEVICE" $BID data)
          mkdir -p "$DATA/Documents/Games" shots
          cp "E4 Demo.gba" "$DATA/Documents/Games/"
          python3 Tests/make_ps1_test.py "$DATA/Documents/Games/E4 PS1 Demo.exe"
          shoot() { sleep "$2"; xcrun simctl io "$DEVICE" screenshot "shots/$1.png"; }
          stop() {
            ( xcrun simctl terminate "$DEVICE" $BID 2>/dev/null & ); sleep 3
            pkill -9 -f "Emu4ios.app/Emu4ios" 2>/dev/null || true
            sleep 1
          }
          for theme in builtin.midnight builtin.dmg; do
            name=${theme#builtin.}
            stop
            xcrun simctl spawn "$DEVICE" defaults write $BID activeThemeID "$theme"
            xcrun simctl spawn "$DEVICE" defaults write $BID autoResume -bool NO
            xcrun simctl launch "$DEVICE" $BID; shoot "library-$name" 6
            stop
            xcrun simctl launch "$DEVICE" $BID -E4AutoPlay "E4 Demo.gba"; shoot "game-$name" 7
          done
          stop
          xcrun simctl spawn "$DEVICE" defaults write $BID activeThemeID builtin.midnight
          xcrun simctl launch "$DEVICE" $BID -E4StartTab themes; shoot "themes" 6
          stop
          xcrun simctl launch "$DEVICE" $BID -E4OpenEditor n64; shoot "editor-n64" 6
          stop
          xcrun simctl launch "$DEVICE" $BID -E4StartTab settings; shoot "settings" 5
          stop
          # Every console: boot its test program, screenshot, and check the app is still alive.
          python3 Tests/make_test_roms.py roms
          ( curl -fsSL -o freedoom.zip https://github.com/freedoom/freedoom/releases/download/v0.13.0/freedoom-0.13.0.zip \
            && unzip -j -o freedoom.zip "*/freedoom1.wad" -d roms ) || echo "freedoom download failed"
          # Free homebrew test programs for the GPU consoles (used only here, never shipped).
          curl -fsSL -o roms/mandelbrot.n64 "https://raw.githubusercontent.com/PeterLemon/N64/master/CP1/Fractal/32BPP/320X240/Mandelbrot/Single/Mandelbrot32BPP320X240.N64" || true
          curl -fsSL -o roms/blend.pbp "https://raw.githubusercontent.com/hrydgard/pspautotests/master/demos/blend.pbp" || true
          cp roms/* "$DATA/Documents/Games/"
          echo "system,file,result" > shots/systems.csv
          for f in roms/*; do
            file=$(basename "$f")
            stop
            xcrun simctl launch "$DEVICE" $BID -E4AutoPlay "$file" > /dev/null
            sleep 9
            if pgrep -f "Emu4ios.app/Emu4ios" > /dev/null; then result=running; else result=CRASHED; fi
            xcrun simctl io "$DEVICE" screenshot "shots/sys-$file.png"
            # Slow-starting GPU consoles: a second, later picture.
            case "$file" in *.n64|*.pbp) sleep 25; xcrun simctl io "$DEVICE" screenshot "shots/sys-$file-later.png" ;; esac
            echo "${file##*.},$file,$result" >> shots/systems.csv
          done
          cat shots/systems.csv
          # Crash reports, if any.
          mkdir -p shots/crashes
          find ~/Library/Logs/DiagnosticReports -name "Emu4ios*" -mmin -60 -exec cp {} shots/crashes/ \; 2>/dev/null || true
          stop
          xcrun simctl launch "$DEVICE" $BID; shoot "library-after-play" 6
          stop
          # PlayStation last, with diagnostics if the app won't close afterwards.
          xcrun simctl launch "$DEVICE" $BID -E4AutoPlay "E4 PS1 Demo.exe"; shoot "game-ps1" 8
          ls -la shots

      - name: Publish screenshots to the ci-screenshots branch
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          [ -d shots ] && [ "$(ls shots)" ] || exit 0
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions"; git config user.email "actions@github.com"
          echo "Screenshots from $GITHUB_SHA" > README.md
          git add -A && git commit -qm "Screenshots for $GITHUB_SHA"
          for attempt in 1 2 3 4 5; do
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots && break
            sleep $((attempt * 10))
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

  testflight:
    name: Upload to TestFlight
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DEVELOPMENT_TEAM; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v — see README 'Publishing'"; exit 1; fi
          done

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: brew install xcodegen

      - uses: actions/cache@v4
        with:
          path: |
            Vendor/mGBA.xcframework
            Vendor/mgba-include
            Vendor/.mgba-commit
          key: mgba-${{ hashFiles('scripts/build-mgba.sh', 'scripts/gen-mgba-defines.sh') }}

      - run: ./scripts/build-mgba.sh

      - name: Collect cores
        uses: actions/download-artifact@v4
        with:
          pattern: core-*
          path: Vendor/Cores
          merge-multiple: true

      - name: Use only the cores that built
        run: python3 scripts/prune-missing-cores.py

      - name: Generate project
        run: xcodegen generate

      - name: Write App Store Connect key
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Emu4ios.xcodeproj \
            -scheme Emu4ios \
            -destination 'generic/platform=iOS' \
            -archivePath build/Emu4ios.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tail -50

      - name: Upload to App Store Connect
        run: |
          sed "s/TEAM_ID/$DEVELOPMENT_TEAM/" scripts/ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/Emu4ios.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

  ipa:
    name: Build IPA for sideloading (AltStore / SideStore)
    needs: [build]
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: brew install xcodegen

      - uses: actions/cache@v4
        with:
          path: |
            Vendor/mGBA.xcframework
            Vendor/mgba-include
            Vendor/.mgba-commit
          key: mgba-${{ hashFiles('scripts/build-mgba.sh', 'scripts/gen-mgba-defines.sh') }}

      - run: ./scripts/build-mgba.sh

      - name: Collect cores
        uses: actions/download-artifact@v4
        with:
          pattern: core-*
          path: Vendor/Cores
          merge-multiple: true

      - name: Use only the cores that built
        run: python3 scripts/prune-missing-cores.py

      - run: xcodegen generate

      - name: Build Release for iPhone (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project Emu4ios.xcodeproj -scheme Emu4ios \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath dd \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tee ipa-build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" ipa-build.log

      - name: Package IPA
        run: |
          APP=dd/Build/Products/Release-iphoneos/Emu4ios.app
          ls "$APP" "$APP/PlugIns" || true
          # Ad-hoc sign so the entitlements (App Group for the widget) travel with the app;
          # AltStore/SideStore replace the signature with your own when installing.
          # Emulator cores first (inside out), then the widget, then the app.
          for fw in "$APP"/Frameworks/*.framework; do codesign -f -s - "$fw"; done
          codesign -f -s - --entitlements Widget/Emu4iosWidget.entitlements "$APP/PlugIns/Emu4iosWidget.appex"
          codesign -f -s - --entitlements App/Emu4ios.entitlements "$APP"
          codesign -d --entitlements - "$APP" | head -20
          codesign --verify --deep --strict "$APP" && echo "Signature OK"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry Emu4ios.ipa Payload
          ls -lh Emu4ios.ipa

      - name: Publish to the "Latest Build" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="Unsigned test build #${{ github.run_number }} from ${GITHUB_SHA::7}. Install with AltStore or SideStore (they sign it with your Apple ID)."
          for attempt in 1 2 3; do
            gh release delete latest --yes --cleanup-tag 2>/dev/null || true
            gh release create latest Emu4ios.ipa --prerelease --title "Latest Build (#${{ github.run_number }})" --notes "$NOTES" --target "$GITHUB_SHA" && break
            sleep 15
          done
