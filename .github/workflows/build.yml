name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_to_testflight:
        description: "Upload a build to TestFlight (needs the App Store Connect secrets)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build app (cloud Mac)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Use newest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache mGBA build
        uses: actions/cache@v4
        with:
          path: Vendor
          key: mgba-${{ hashFiles('scripts/build-mgba.sh', 'scripts/gen-mgba-defines.sh') }}

      - name: Build mGBA for iOS
        run: ./scripts/build-mgba.sh

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Emu4ios.xcodeproj \
            -scheme Emu4ios \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            | tee build.log | grep -E "error:|warning: .*Emu4ios|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Show app warnings
        if: always()
        run: |
          echo "Compiled: $(grep -c '^SwiftCompile' build.log || true) Swift steps, $(grep -c '^CompileC' build.log || true) C files, $(grep -c '^CompileMetalFile' build.log || true) Metal files"
          grep -E "(/App/|/Widget/).*(warning|error):" build.log | sed 's|.*/emu4ios/||' | sort -u | head -150 || true

      - name: Screenshots in the iPhone Simulator
        continue-on-error: true
        run: |
          set -x
          python3 Tests/make_test_rom.py "E4 Demo.gba"
          xcodebuild build -project Emu4ios.xcodeproj -scheme Emu4ios -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath dd CODE_SIGNING_ALLOWED=NO -quiet
          APP=$(find dd/Build/Products -name "Emu4ios.app" -maxdepth 3 | head -1)
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in sorted(d.items(),reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone') and 'Pro' in x['name']))")
          xcrun simctl boot "$DEVICE"; xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryLevel 100 --cellularBars 4 || true
          xcrun simctl install "$DEVICE" "$APP"
          BID=com.fuxkingjosh.emu4ios
          DATA=$(xcrun simctl get_app_container "$DEVICE" $BID data)
          mkdir -p "$DATA/Documents/Games" shots
          cp "E4 Demo.gba" "$DATA/Documents/Games/"
          shoot() { sleep "$2"; xcrun simctl io "$DEVICE" screenshot "shots/$1.png"; }
          for theme in builtin.midnight builtin.neon builtin.dmg builtin.candy; do
            name=${theme#builtin.}
            xcrun simctl terminate "$DEVICE" $BID || true
            xcrun simctl spawn "$DEVICE" defaults write $BID activeThemeID "$theme"
            xcrun simctl spawn "$DEVICE" defaults write $BID autoResume -bool NO
            xcrun simctl launch "$DEVICE" $BID; shoot "library-$name" 6
            xcrun simctl terminate "$DEVICE" $BID || true
            xcrun simctl launch "$DEVICE" $BID -E4AutoPlay "E4 Demo.gba"; shoot "game-$name" 7
          done
          xcrun simctl terminate "$DEVICE" $BID || true
          xcrun simctl spawn "$DEVICE" defaults write $BID activeThemeID builtin.midnight
          xcrun simctl launch "$DEVICE" $BID -E4StartTab themes; shoot "themes" 6
          xcrun simctl terminate "$DEVICE" $BID || true
          xcrun simctl launch "$DEVICE" $BID -E4StartTab stats; shoot "stats" 5
          xcrun simctl terminate "$DEVICE" $BID || true
          xcrun simctl launch "$DEVICE" $BID; shoot "library-after-play" 5
          ls -la shots

      - name: Publish screenshots to the ci-screenshots branch
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          [ -d shots ] && [ "$(ls shots)" ] || exit 0
          cd shots
          git init -q -b ci-screenshots
          git config user.name "github-actions"; git config user.email "actions@github.com"
          echo "Screenshots from $GITHUB_SHA" > README.md
          git add -A && git commit -qm "Screenshots for $GITHUB_SHA"
          for attempt in 1 2 3 4 5; do
            git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots && break
            sleep $((attempt * 10))
          done

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

  testflight:
    name: Upload to TestFlight
    needs: build
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_to_testflight }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DEVELOPMENT_TEAM; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret for $v — see README 'Publishing'"; exit 1; fi
          done

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: brew install xcodegen

      - uses: actions/cache@v4
        with:
          path: Vendor
          key: mgba-${{ hashFiles('scripts/build-mgba.sh', 'scripts/gen-mgba-defines.sh') }}

      - run: ./scripts/build-mgba.sh

      - name: Generate project
        run: xcodegen generate

      - name: Write App Store Connect key
        run: |
          mkdir -p ~/private_keys
          echo "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Emu4ios.xcodeproj \
            -scheme Emu4ios \
            -destination 'generic/platform=iOS' \
            -archivePath build/Emu4ios.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            | tail -50

      - name: Upload to App Store Connect
        run: |
          sed "s/TEAM_ID/$DEVELOPMENT_TEAM/" scripts/ExportOptions.plist > build/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/Emu4ios.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
